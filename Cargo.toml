[workspace]
members = ["crates/*", "xtask"]
# Les spikes P0 sont des binaires d'exploration jetables, hors du code de production
# (cahier des charges, OBL-005) : ils vivent sous `spikes/`, avec leur propre espace de
# travail et leurs propres règles.
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LordPhenixDeNetra/obliNiscor"

# Le noyau ne doit jamais toucher au système : `unsafe` est interdit partout, et la seule
# dérogation est déclarée dans `obliniscor-sys` (ADR-004, SEC-9).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
obliniscor-core = { path = "crates/core", version = "0.1.0" }
obliniscor-platform = { path = "crates/platform", version = "0.1.0" }
obliniscor-proto = { path = "crates/proto", version = "0.1.0" }
obliniscor-store = { path = "crates/store", version = "0.1.0" }
obliniscor-sys = { path = "crates/sys", version = "0.1.0" }
# Bibliothèques de la suite, clonées à côté de ce dépôt (comme ankou et le launcher).
lpdnsoft-atomic = { path = "../lpdnsoft-libs/crates/atomic", version = "0.1.0" }
lpdnsoft-i18n = { path = "../lpdnsoft-libs/crates/i18n", version = "0.1.0" }
lpdnsoft-log = { path = "../lpdnsoft-libs/crates/log", version = "0.1.0" }
lpdnsoft-settings = { path = "../lpdnsoft-libs/crates/settings", version = "0.1.0" }
lpdnsoft-ui = { path = "../lpdnsoft-libs/crates/ui", version = "0.1.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
