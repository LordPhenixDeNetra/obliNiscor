[advisories]
version = 2
yanked = "deny"
unmaintained = "all"

[licenses]
version = 2
# Liste commune aux dépôts LPDNSoft.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    # Polices par défaut d'egui (epaint_default_fonts) : OFL et licence Ubuntu, permissives.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Autorités de certification de Mozilla (webpki-root-certs) : licence de données
    # permissive, comme webpki-roots.
    "CDLA-Permissive-2.0",
]

# MPL-2.0 est un copyleft **par fichier**, pas par œuvre : lier `option-ext` sans le modifier
# ne contamine pas obliNiscor, et la licence du projet (MIT OR Apache-2.0) reste valable pour
# tout son propre code. La crate arrive par `lpdnsoft-settings` → `dirs-sys` : elle est
# transitive, nous ne la modifions pas et nous ne la distribuons pas en source (ADR-008).
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
